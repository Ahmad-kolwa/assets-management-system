<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Management</title>
</head>

<body>

```
<h2>Department Management</h2>

<a href="dashboard.html">Back to Dashboard</a>

<br><br>

<button onclick="logout()">Logout</button>

<hr>

<h3>Add Department</h3>

<label>Department Name:</label><br>
<input type="text" id="departmentName"><br><br>

<button onclick="saveDepartment()">Save Department</button>

<hr>

<h3>Department List</h3>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>ID</th>
            <th>Department Name</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="departmentTable"></tbody>
</table>
```

<script>

const API_URL = "http://127.0.0.1:8000/api";

const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user"));

// Check login
if (!token || !user) {
    alert("Please login first.");
    window.location.href = "login.html";
}

// Only Admin can access
if (user.role !== "admin") {
    alert("Access denied. Admin only.");
    window.location.href = "dashboard.html";
}

// Load departments on page open
loadDepartments();


// ================================
// LOAD DEPARTMENTS
// ================================

async function loadDepartments() {

    const response = await fetch(API_URL + "/departments", {

        headers: {
            "Authorization": "Bearer " + token,
            "Accept": "application/json"
        }

    });

    const data = await response.json();

    const table = document.getElementById("departmentTable");

    table.innerHTML = "";

    data.data.forEach(function(department) {

        table.innerHTML += `
            <tr>
                <td>${department.id}</td>
                <td>${department.name}</td>
                <td>
                    <button onclick="editDepartment(${department.id}, '${department.name}')">
                        Edit
                    </button>

                    <button onclick="deleteDepartment(${department.id})">
                        Delete
                    </button>
                </td>
            </tr>
        `;

    });

}


// ================================
// CREATE DEPARTMENT
// ================================

async function saveDepartment() {

    const name = document.getElementById("departmentName").value;

    const response = await fetch(API_URL + "/departments", {

        method: "POST",


        headers: {

            "Authorization": "Bearer " + token,

            "Content-Type": "application/json",

            "Accept": "application/json"

        },


        body: JSON.stringify({
            name: name
        })

    });

    const data = await response.json();

    if (response.ok) {

        alert("Department created successfully.");

        document.getElementById("departmentName").value = "";

        loadDepartments();

    }

    else {

        alert(data.message || "Failed to create department.");

    }

}


// ================================
// EDIT DEPARTMENT
// ================================

async function editDepartment(id, currentName) {

    const newName = prompt("Enter new department name:", currentName);

    if (!newName) {
        return;
    }

    const response = await fetch(
        API_URL + "/departments/" + id,
        {

            method: "PUT",


            headers: {

                "Authorization": "Bearer " + token,

                "Content-Type": "application/json",

                "Accept": "application/json"

            },


            body: JSON.stringify({
                name: newName
            })

        }
    );

    const data = await response.json();

    if (response.ok) {

        alert("Department updated successfully.");

        loadDepartments();

    }

    else {

        alert(data.message || "Failed to update department.");

    }

}


// ================================
// DELETE DEPARTMENT
// ================================

async function deleteDepartment(id) {

    if (!confirm("Are you sure you want to delete this department?")) {
        return;
    }

    const response = await fetch(
        API_URL + "/departments/" + id,
        {

            method: "DELETE",


            headers: {

                "Authorization": "Bearer " + token,

                "Accept": "application/json"

            }

        }
    );

    const data = await response.json();

    if (response.ok) {

        alert("Department deleted successfully.");

        loadDepartments();

    }

    else {

        alert(data.message || "Failed to delete department.");

    }

}


// ================================
// LOGOUT
// ================================

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("user");

    window.location.href = "login.html";

}

</script>

</body>
</html>
