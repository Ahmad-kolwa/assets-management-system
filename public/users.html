<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
</head>

<body>

    <h2>User Management</h2>

    <a href="dashboard.html">Back to Dashboard</a>
    <br><br>

    <button onclick="logout()">Logout</button>

    <hr>

    <h3>All Users</h3>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="userTable">
            <tr>
                <td colspan="6">Loading users...</td>
            </tr>
        </tbody>
    </table>


<script>

const API_URL = "http://127.0.0.1:8000/api";

const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user"));


// Check login
if (!token || !user) {

    alert("Please login first.");
    window.location.href = "login.html";

}


// Check Admin
if (user.role !== "admin") {

    alert("Access denied. Admin only.");
    window.location.href = "dashboard.html";

}


// Load users when page opens
loadUsers();


// ===============================
// LOAD ALL USERS
// ===============================

async function loadUsers() {

    try {

        const response = await fetch(API_URL + "/users", {

            method: "GET",

            headers: {
                "Authorization": "Bearer " + token,
                "Accept": "application/json"
            }

        });


        const data = await response.json();

        console.log("Users response:", data);


        if (!response.ok) {

            alert(data.message || "Failed to load users.");
            return;

        }


        const table = document.getElementById("userTable");

        table.innerHTML = "";


        if (!data.data || data.data.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="6">No users found.</td>
                </tr>
            `;

            return;
        }


        data.data.forEach(function(user) {

            let status = user.is_active ? "Active" : "Inactive";


            let actionButtons = "";


            // Don't allow admin to deactivate himself
            if (user.id === JSON.parse(localStorage.getItem("user")).id) {

                actionButtons = `
                    <span>Current Account</span>
                `;

            }

            else {

                if (user.is_active) {

                    actionButtons = `
                        <button onclick="changeRole(${user.id}, '${user.role}')">
                            Change Role
                        </button>

                        <button onclick="deactivateUser(${user.id})">
                            Deactivate
                        </button>
                    `;

                }

                else {

                    actionButtons = `
                        <button onclick="changeRole(${user.id}, '${user.role}')">
                            Change Role
                        </button>

                        <button onclick="activateUser(${user.id})">
                            Activate
                        </button>
                    `;

                }

            }


            table.innerHTML += `

                <tr>

                    <td>${user.id}</td>

                    <td>${user.name}</td>

                    <td>${user.email}</td>

                    <td>${user.role}</td>

                    <td>${status}</td>

                    <td>
                        ${actionButtons}
                    </td>

                </tr>

            `;

        });


    }

    catch (error) {

        console.error(error);

        alert("Unable to connect to the server.");

    }

}


// ===============================
// CHANGE ROLE
// ===============================

async function changeRole(id, currentRole) {

    let newRole = prompt(
        "Enter new role: admin, hod, or employee",
        currentRole
    );


    if (!newRole) {
        return;
    }


    newRole = newRole.toLowerCase().trim();


    if (
        newRole !== "admin" &&
        newRole !== "hod" &&
        newRole !== "employee"
    ) {

        alert("Invalid role. Use admin, hod, or employee.");

        return;
    }


    try {

        const response = await fetch(
            API_URL + "/users/" + id + "/role",
            {

                method: "PUT",

                headers: {

                    "Authorization": "Bearer " + token,

                    "Content-Type": "application/json",

                    "Accept": "application/json"

                },

                body: JSON.stringify({

                    role: newRole

                })

            }
        );


        const data = await response.json();

        console.log("Role response:", data);


        if (!response.ok) {

            alert(data.message || "Failed to change role.");

            return;

        }


        alert("User role changed successfully.");

        loadUsers();

    }

    catch (error) {

        console.error(error);

        alert("Unable to connect to the server.");

    }

}


// ===============================
// DEACTIVATE USER
// ===============================

async function deactivateUser(id) {

    const confirmDeactivate = confirm(
        "Are you sure you want to deactivate this user?"
    );


    if (!confirmDeactivate) {
        return;
    }


    try {

        const response = await fetch(
            API_URL + "/users/" + id + "/deactivate",
            {

                method: "PUT",

                headers: {

                    "Authorization": "Bearer " + token,

                    "Accept": "application/json"

                }

            }
        );


        const data = await response.json();


        if (!response.ok) {

            alert(data.message || "Failed to deactivate user.");

            return;

        }


        alert("User deactivated successfully.");

        loadUsers();

    }

    catch (error) {

        console.error(error);

        alert("Unable to connect to the server.");

    }

}


// ===============================
// ACTIVATE USER
// ===============================

async function activateUser(id) {

    const confirmActivate = confirm(
        "Are you sure you want to activate this user?"
    );


    if (!confirmActivate) {
        return;
    }


    try {

        const response = await fetch(
            API_URL + "/users/" + id + "/activate",
            {

                method: "PUT",

                headers: {

                    "Authorization": "Bearer " + token,

                    "Accept": "application/json"

                }

            }
        );


        const data = await response.json();


        if (!response.ok) {

            alert(data.message || "Failed to activate user.");

            return;

        }


        alert("User activated successfully.");

        loadUsers();

    }

    catch (error) {

        console.error(error);

        alert("Unable to connect to the server.");

    }

}


// ===============================
// LOGOUT
// ===============================

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("user");

    window.location.href = "login.html";

}

</script>

</body>
</html>
