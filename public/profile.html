<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>
</head>

<body>

    <h2>My Profile</h2>

    <a href="dashboard.html">Back to Dashboard</a>

    <br><br>

    <button onclick="logout()">Logout</button>

    <hr>

    <h3>Profile Information</h3>

    <p>
        <strong>ID:</strong>
        <span id="userId"></span>
    </p>

    <p>
        <strong>Role:</strong>
        <span id="userRole"></span>
    </p>

    <p>
        <strong>Account Status:</strong>
        <span id="userStatus"></span>
    </p>

    <p>
        <strong>Created At:</strong>
        <span id="createdAt"></span>
    </p>

    <hr>

    <h3>Update Profile</h3>

    <label>Name:</label>
    <br>

    <input
        type="text"
        id="name"
    >

    <br><br>

    <label>Email:</label>
    <br>

    <input
        type="email"
        id="email"
    >

    <br><br>

    <button onclick="updateProfile()">
        Update Profile
    </button>


<script>

const API_URL = "http://127.0.0.1:8000/api";

const token = localStorage.getItem("token");


// =====================================
// CHECK LOGIN
// =====================================

if (!token) {

    alert("Please login first.");

    window.location.href = "login.html";

}


// =====================================
// LOAD PROFILE
// =====================================

loadProfile();


async function loadProfile() {

    try {

        const response = await fetch(
            API_URL + "/profile",
            {

                method: "GET",

                headers: {

                    "Authorization":
                        "Bearer " + token,

                    "Accept":
                        "application/json"

                }

            }
        );


        const result = await response.json();

        console.log("Profile:", result);


        if (!response.ok) {

            alert(
                result.message ||
                "Failed to load profile."
            );

            return;

        }


        const user = result.data;


        document.getElementById("userId")
            .innerText = user.id;


        document.getElementById("userRole")
            .innerText = user.role;


        document.getElementById("name")
            .value = user.name;


        document.getElementById("email")
            .value = user.email;


        document.getElementById("createdAt")
            .innerText = user.created_at;


        // Your current profile() does not
        // return is_active, so use the
        // local user information if available.

        const storedUser =
            JSON.parse(
                localStorage.getItem("user")
            );


        if (
            storedUser &&
            storedUser.is_active !== undefined
        ) {

            document.getElementById("userStatus")
                .innerText =
                storedUser.is_active
                    ? "Active"
                    : "Inactive";

        }

        else {

            document.getElementById("userStatus")
                .innerText = "Active";

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server."
        );

    }

}


// =====================================
// UPDATE PROFILE
// =====================================

async function updateProfile() {

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;


    if (!name || !email) {

        alert(
            "Name and email are required."
        );

        return;

    }


    try {

        const response = await fetch(
            API_URL + "/profile",
            {

                method: "PUT",

                headers: {

                    "Authorization":
                        "Bearer " + token,

                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"

                },

                body: JSON.stringify({

                    name: name,
                    email: email

                })

            }
        );


        const result =
            await response.json();


        console.log(
            "Update profile:",
            result
        );


        if (!response.ok) {

            alert(
                result.message ||
                "Failed to update profile."
            );

            return;

        }


        alert(
            "Profile updated successfully."
        );


        // Update localStorage user information
        // so dashboard displays the new name/email.

        const storedUser =
            JSON.parse(
                localStorage.getItem("user")
            );


        if (storedUser) {

            storedUser.name =
                result.data.name;

            storedUser.email =
                result.data.email;

            localStorage.setItem(
                "user",
                JSON.stringify(storedUser)
            );

        }


        loadProfile();

    }

    catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server."
        );

    }

}


// =====================================
// LOGOUT
// =====================================

function logout() {

    localStorage.removeItem("token");

    localStorage.removeItem("user");

    window.location.href =
        "login.html";

}

</script>

</body>

</html>
